<footer class="buy-footer">
  <div class="d-flex align-items-center justify-content-between">
    <div class="price-section">
      <h6>Price</h6>
      <p class="price-value mb-0">
        {{ getDisplayPrice() | priceFormatPipeTs }}
      </p>
    </div>
    <button
      class="btn buy-btn"
      type="button"
      [routerLink]="['/coffee-order', id]"
      [state]="{priceDetail: getDisplayPrice()}"
    >
      Buy Now
    </button>
  </div>
</footer>
