<app-top-navigation title="Order" [showRightIcon]="false"></app-top-navigation> 
<!-- Delivery/Pickup Toggle -->
<section class="delivery-toggle">
  <fieldset  class="btn-group delivery-options container-fluid" role="group" aria-label="Delivery options">
    <button type="button" class="btn deliver-btn active">
      Deliver
    </button>
    <button type="button" class="btn pickup-btn">
      Pick Up
    </button>
  </fieldset>
</section>

<!-- Delivery Address -->
<section class="delivery-address card">
  <div class="card-body">
    <h2 class="card-title">Delivery Address</h2>
    <address class="delivery-info">
      <div class="address-main">Jl. Kpg Sutoyo</div>
      <div class="address-detail">
        Kpg. Sutoyo No. 620, Bilzen, Tanjungbalai.
      </div>
    </address>

    <div class="address-actions">
      <button type="button" class="btn btn-outline-secondary action-btn">
        <i class="ri-edit-line"></i>
        <span>Edit Address</span>
      </button>
      <button type="button" class="btn btn-outline-secondary action-btn">
        <i class="ri-file-list-line"></i>
        <span>Add Note</span>
      </button>
    </div>
    <hr>
  </div>
</section>

<!-- Product Item -->
<section class="product-item card">
  <div class="card-body mb-3">
    <article class="product-details d-flex align-items-center">
      <div class="product-image">
        <img
          src="https://readdy.ai/api/search-image?query=top%20view%20of%20coffee%20latte%20with%20beautiful%20latte%20art%2C%20creamy%20foam%2C%20in%20a%20black%20ceramic%20cup%20on%20saucer%2C%20professional%20barista%20style%2C%20high-quality%20food%20photography%2C%20isolated%20on%20white%20background&width=200&height=200&seq=coffee1&orientation=squarish"
          alt="Caffe Mocha"
          class="img-fluid"
        />
      </div>
      <div class="product-info">
        <h3 class="product-name">Caffe Mocha</h3>
        <p class="product-variant">Deep Foam</p>
      </div>
      <div class="quantity-control d-flex align-items-center">
        <button type="button" class="btn btn-outline-secondary quantity-btn">
          <i class="ri-subtract-line"></i>
        </button>
        <span class="quantity-display">1</span>
        <button type="button" class="btn btn-outline-secondary quantity-btn">
          <i class="ri-add-line"></i>
        </button>
      </div>
    </article>
  </div>
  <hr>
</section>

<!-- Discount Section -->
<section class="discount-section card">
  <div class="card-body">
    <div class="discount-info">
      <div class="discount-content">
        <i class="ri-coupon-3-line discount-icon"></i>
        <span class="discount-text">1 Discount is Applied</span>
      </div>
      <button type="button" class="btn btn-link discount-arrow" aria-label="View discount details">
        <i class="ri-arrow-right-s-line"></i>
      </button>
    </div>
  </div>
</section>

<!-- Payment Summary -->
<section class="payment-summary card">
  <div class="card-body">
    <h2 class="card-title">Payment Summary</h2>

    <div class="summary-items">
      <div class="summary-item d-flex justify-content-between">
        <span class="item-label">Price</span>
        <span class="item-value">$ 4.53</span>
      </div>

      <div class="summary-item d-flex justify-content-between">
        <span class="item-label">Delivery Fee</span>
        <div class="fee-pricing d-flex gap-2">
          <span class="original-fee">$ 2.0</span>
          <span class="item-value">$ 1.0</span>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Payment Method -->
<section class="payment-method">
  <button type="button" class="btn payment-method-btn">
    <div class="payment-info">
      <i class="ri-wallet-3-line payment-icon"></i>
      <span class="payment-type">Cash/Wallet</span>
    </div>
    <div class="payment-amount">
      <span class="total-amount">$ 5.53</span>
      <i class="ri-arrow-down-s-line arrow-icon"></i>
    </div>
  </button>
</section>

<!-- Order Button -->
<footer class="order-footer">
  <button type="button" class="btn btn-primary order-btn">
    Order
  </button>
</footer>
